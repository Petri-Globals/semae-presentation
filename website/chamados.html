<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Chamados — SEMAE Atendimento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h1>Meus Chamados</h1>

    <div class="filtros-bar">
      <select id="filtro-status">
        <option value="todos">Todos os Status</option>
        <option value="Aberto">Aberto</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Resolvido">Resolvido</option>
      </select>
      <input type="text" id="filtro-busca" placeholder="Buscar por texto...">
      <button class="btn btn-secondary" id="btn-limpar-filtros">Limpar Filtros</button>
    </div>

    <div class="card">
      <table class="tabela" id="tabela-chamados">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Endereço</th>
            <th>Status</th>
            <th>Urgência</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="vazio-msg" id="msg-vazio" style="display:none;">Nenhum chamado encontrado.</div>
    </div>
  </div>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chamados.js"></script>
</body>
</html>
