<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — SEMAE Atendimento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h1>Meu Perfil</h1>

    <div class="card">
      <div class="perfil-avatar" id="avatar-inicial">C</div>

      <form id="form-perfil">
        <div class="form-row">
          <div class="form-group" id="grupo-nome">
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome">
          </div>
          <div class="form-group" id="grupo-email">
            <label for="campo-email">E-mail</label>
            <input type="email" id="campo-email">
          </div>
        </div>
        <div class="form-group" id="grupo-telefone" style="max-width:400px;">
          <label for="campo-telefone">Telefone</label>
          <input type="text" id="campo-telefone">
          <span class="error-msg">Campo obrigatório.</span>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Salvar Alterações</button>
      </form>
    </div>
  </div>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
