<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajuda — SEMAE Atendimento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h1>Perguntas Frequentes</h1>
    <p style="color:#5a7a8a;margin-bottom:24px;">Encontre respostas para as dúvidas mais comuns sobre os serviços da SEMAE.</p>

    <div class="accordion" id="faq-container"></div>
  </div>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function() {
      const faq = obterFAQ();
      const container = document.getElementById("faq-container");

      faq.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "accordion-item";
        div.innerHTML = `
          <div class="accordion-header">${item.pergunta}</div>
          <div class="accordion-body"><p>${item.resposta}</p></div>
        `;
        div.querySelector(".accordion-header").addEventListener("click", function() {
          div.classList.toggle("open");
        });
        container.appendChild(div);
      });
    })();
  </script>
</body>
</html>
